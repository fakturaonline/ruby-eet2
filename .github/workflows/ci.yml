name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_playground:
        description: Run the opt-in official Playground E2E matrix
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.2.2"
          - "3.2.11"
          - "3.3.12"
          - "3.4.10"
          - "4.0.6"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install --yes xmlsec1
      - run: bundle exec rake sources:verify
      - run: bundle exec rspec
      - run: bundle exec standardrb
      - run: bundle exec rbs validate
      - run: bundle exec rake xmlsec:verify
      - run: bundle exec ruby script/verify_package

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
      - run: bundle exec bundler-audit check --update

  live-playground:
    if: github.event_name == 'workflow_dispatch' && inputs.live_playground
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install --yes unzip xmlsec1
      - run: bundle exec ruby script/e2e_playground
